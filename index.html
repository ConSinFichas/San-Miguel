<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSF - San Miguel</title>
<style>
    * { 
        box-sizing: border-box; 
        user-select: none; 
    }

    body {
        background-color: #031407;
        color: #00ff66;
        font-family: 'Courier New', Courier, monospace;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-image: 
            linear-gradient(rgba(0, 255, 102, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 102, 0.05) 1px, transparent 1px);
        background-size: 25px 25px;
        overflow: hidden;
    }

    /* Consola Principal: Mantiene la proporción contenida sin desbordar el borde inferior */
    #console {
        width: 95%;
        max-width: 420px;
        height: 85vh;
        max-height: 820px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border: 2px solid #00ff66;
        padding: 15px 18px;
        background-color: #051d0d;
        border-radius: 20px;
        box-shadow: 0 0 25px rgba(0, 255, 102, 0.3), inset 0 0 15px rgba(0, 255, 102, 0.1);
    }

    /* Reproductor de Audio */
    #music-player {
        border: 1px solid #00ff66;
        border-radius: 6px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(0, 255, 102, 0.03);
        box-shadow: 0 0 5px rgba(0, 255, 102, 0.1) inset;
    }

    #play-btn-box {
        border: 1px solid #00ff66;
        border-radius: 4px;
        width: 32px; 
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background: rgba(0, 255, 102, 0.1);
    }

    .play-icon {
        width: 0; 
        height: 0; 
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-left: 8px solid #00ff66;
        transition: all 0.2s;
        margin-left: 2px;
    }

    .play-icon.playing {
        border-top: none; 
        border-bottom: none; 
        border-left: 2.5px solid #00ff66;
        border-right: 2.5px solid #00ff66;
        width: 8px; 
        height: 10px;
        background: transparent;
        margin-left: 0;
    }

    .track-info {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .track-name {
        font-size: 9px;
        letter-spacing: 1.5px;
        font-weight: bold;
    }

    .track-bar-container {
        width: 100%;
        height: 6px;
        background: rgba(0, 255, 102, 0.1);
        border-radius: 3px;
        position: relative;
        overflow: hidden;
    }

    .track-progress {
        width: 0%;
        height: 100%;
        background: #00ff66;
        transition: width 0.1s linear;
    }

    /* Pantalla del juego (Relación de aspecto exacta 600x480) */
    #game-screen {
        border: 2px solid #00ff66;
        width: 100%;
        aspect-ratio: 600 / 480;
        height: auto;
        background-color: #010c05;
        position: relative;
        border-radius: 4px;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0, 255, 102, 0.2) inset;
        cursor: pointer;
        touch-action: none;
    }

    canvas { 
        display: block; 
        width: 100%; 
        height: 100%; 
    }

    .brand-title {
        text-align: center; 
        font-size: 13px; 
        letter-spacing: 3px; 
        color: #00ff66;
        text-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
    }

    /* Área de Mandos y Botones */
    #controls-area {
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        padding: 0 2px;
    }

    /* D-PAD (Cruceta direccional) */
    .d-pad { 
        position: relative; 
        width: 132px; 
        height: 132px; 
    }

    .d-btn {
        position: absolute; 
        background: rgba(0, 255, 102, 0.05);
        border: 1px solid #00ff66; 
        display: flex; 
        justify-content: center; 
        align-items: center;
        color: #00ff66; 
        font-size: 15px; 
        box-shadow: 0 0 5px rgba(0, 255, 102, 0.2);
    }

    .d-up { top: 0; left: 44px; width: 44px; height: 44px; border-bottom: none; border-radius: 5px 5px 0 0; }
    .d-down { bottom: 0; left: 44px; width: 44px; height: 44px; border-top: none; border-radius: 0 0 5px 5px; }
    .d-left { top: 44px; left: 0; width: 44px; height: 44px; border-right: none; border-radius: 5px 0 0 5px; }
    .d-right { top: 44px; right: 0; width: 44px; height: 44px; border-left: none; border-radius: 0 5px 5px 0; }
    .d-center { top: 44px; left: 44px; width: 44px; height: 44px; border: 1px solid #00ff66; background: rgba(0, 255, 102, 0.15); }

    /* Botones de Acción A y B */
    .action-container { 
        display: flex; 
        gap: 16px; 
        align-items: flex-end; 
    }

    .action-group { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        gap: 4px; 
    }

    .action-btn {
        width: 68px; 
        height: 68px; 
        border-radius: 50%;
        border: 2px solid #00ff66; 
        background: rgba(0, 255, 102, 0.08);
        color: #00ff66; 
        font-size: 22px; 
        font-weight: bold; 
        display: flex;
        justify-content: center; 
        align-items: center; 
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0, 255, 102, 0.3); 
        transition: background 0.1s;
    }

    .action-btn:active { 
        background: rgba(0, 255, 102, 0.3); 
        box-shadow: 0 0 15px rgba(0, 255, 102, 0.6); 
    }

    .action-label { 
        font-size: 9px; 
        letter-spacing: 1px; 
        color: #00ff66; 
    }

    /* Escalonamiento del botón B */
    #group-b { 
        margin-bottom: 24px; 
    }

    /* Pie con atajos de teclado */
    .footer-shortcuts {
        display: flex; 
        justify-content: space-between; 
        font-size: 8px;
        color: rgba(0, 255, 102, 0.6); 
        border-top: 1px dashed rgba(0, 255, 102, 0.2); 
        padding-top: 8px;
    }
</style>
</head>
<body>

<div id="console">
    <div id="music-player">
        <div id="play-btn-box" onclick="toggleAudio()">
            <div class="play-icon" id="play-icon"></div>
        </div>
        <div class="track-info">
            <div class="track-name" id="track-title">SAN MIGUEL EXPRESS</div>
            <div class="track-bar-container">
                <div class="track-progress" id="track-progress"></div>
            </div>
        </div>
    </div>

    <div id="game-screen">
        <canvas id="gameCanvas" width="600" height="450"></canvas>
    </div>

    <div class="brand-title" id="brand-title-text">
        〰️ Con Sin Fichas 〰️
    </div>

    <div id="controls-area">
        <div class="d-pad">
            <div class="d-btn d-up" id="btn-up">▲</div>
            <div class="d-btn d-left" id="btn-left">◀</div>
            <div class="d-btn d-center"></div>
            <div class="d-btn d-right" id="btn-right">▶</div>
            <div class="d-btn d-down" id="btn-down">▼</div>
        </div>
        
        <div class="action-container">
            <div class="action-group" id="group-b">
                <div class="action-btn" id="btn-b">B</div>
                <span class="action-label">LARGAR TREN</span>
            </div>
            <div class="action-group" id="group-a">
                <div class="action-btn" id="btn-a">A</div>
                <span class="action-label">COLOCAR VÍA</span>
            </div>
        </div>
    </div>

    <div class="footer-shortcuts">
        <span>⌨ Flechas: Mover Cursor | A: Colocar Vía</span>
        <span>B: Largar Tren Anticipado</span>
    </div>
</div>

<script>
    const RANKING_API_URL = 'https://script.google.com/macros/s/AKfycbxccL-H1HNQD7cjLuBdkyJjZaxgK9_pz6orr3DGTR61RX-UlyHR9vM4w84yWTHvXMWGiQ/exec';
    let topPlayers = JSON.parse(localStorage.getItem('cachedRanking_SanMiguel')) || [];
    let scoreSaved = false;

    let INITIAL_TIMER = 232;
    let TRAIN_SPEED = 0.02;

    let audioElement = null;
    let images = {};
    let lastAudioTime = 0;

    const TRACK_TYPES = {
        'via1': { name: 'Horizontal', ports: [0, 1, 0, 1] },
        'via2': { name: 'Vertical',   ports: [1, 0, 1, 0] },
        'via3': { name: 'Curva NE',   ports: [1, 1, 0, 0] },
        'via4': { name: 'Curva ES',   ports: [0, 1, 1, 0] },
        'via5': { name: 'Curva SO',   ports: [0, 0, 1, 1] },
        'via6': { name: 'Curva ON',   ports: [1, 0, 0, 1] }
    };
    const TRACK_KEYS = ['via1', 'via2', 'via3', 'via4', 'via5', 'via6'];

    const COLS = 8;
    const ROWS = 8;
    const GRID_WIDTH = 450;
    const CELL_SIZE = GRID_WIDTH / COLS;
    const SIDEBAR_X = 450;
    const SIDEBAR_WIDTH = 150;

    const INTERMEDIATE_STATION_POOL = [
        "V. DEL PARQUE", "S. PEÑA", "S. LUGARES", "CASEROS",
        "PALOMAR", "HURLINGHAM", "W. MORRIS", "MUÑIZ",
        "B. VISTA", "JOSE C. PAZ"
    ];

    let grid = [];
    let queue = [];
    let cursor = { col: 2, row: 0 };
    let timer = INITIAL_TIMER;
    let timerInterval = null;
    let roundAudioStart = 0;

    // Métricas Acumuladas de la Sesión
    let sessionScore = 0;
    let totalCoins = 0;
    let totalTracksTraversed = 0;
    let roundCount = 0;

    // Métricas de la Ronda Actual
    let roundScore = 0;

    let gameState = 'START'; // 'START', 'BUILDING', 'RUNNING', 'VICTORY', 'GAMEOVER', 'SESSION_END'
    let train = { col: 0, row: 0, entryPort: 3, exitPort: 1, progress: 0, speed: TRAIN_SPEED, lastStation: null };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function fetchRanking() {
        fetch(RANKING_API_URL)
            .then(res => res.json())
            .then(data => { 
                let fetchedList = [];
                if (Array.isArray(data)) {
                    fetchedList = data;
                } else if (data && Array.isArray(data.ranking)) {
                    fetchedList = data.ranking;
                }

                if (fetchedList.length > 0) {
                    topPlayers = fetchedList;
                    localStorage.setItem('cachedRanking_SanMiguel', JSON.stringify(fetchedList));
                    if (gameState === 'SESSION_END') {
                        drawScreen();
                    }
                }
            })
            .catch(err => console.log("Cargando ranking inicial...", err));
    }

    function loadConfigAndAssets(callback) {
        fetchRanking();
        fetch('config.json?v=' + Date.now())
            .then(res => res.json())
            .then(config => {
                if (config.timer) INITIAL_TIMER = config.timer;
                if (config.trainSpeed) TRAIN_SPEED = config.trainSpeed;
                if (config.audio && config.audio.file) {
                    audioElement = new Audio(config.audio.file);
                    audioElement.loop = true;
                    audioElement.addEventListener('timeupdate', updateAudioProgressBar);
                }
                if (config.audio && config.audio.title) {
                    document.getElementById('track-title').innerText = config.audio.title;
                }

                let assetsObj = config.assets || {};
                if (!assetsObj['train']) assetsObj['train'] = 'images/train.png';

                loadImages(assetsObj, callback);
            })
            .catch(err => {
                console.warn("Cargando recursos por defecto...", err);
                audioElement = new Audio('audios/san_miguel.mp3');
                audioElement.loop = true;
                audioElement.addEventListener('timeupdate', updateAudioProgressBar);
                loadImages({
                    'via1': 'images/via1.png',
                    'via2': 'images/via2.png',
                    'via3': 'images/via3.png',
                    'via4': 'images/via4.png',
                    'via5': 'images/via5.png',
                    'via6': 'images/via6.png',
                    'train': 'images/train.png'
                }, callback);
            });
    }

    function loadImages(assetsObj, callback) {
        let keys = Object.keys(assetsObj);
        let loaded = 0;
        if (keys.length === 0) { callback(); return; }
        keys.forEach(key => {
            images[key] = new Image();
            images[key].src = assetsObj[key];
            images[key].onload = () => { loaded++; if (loaded === keys.length) callback(); };
            images[key].onerror = () => { loaded++; if (loaded === keys.length) callback(); };
        });
    }

    function updateAudioProgressBar() {
        if (audioElement && audioElement.duration) {
            const cur = audioElement.currentTime;
            const pct = (cur / audioElement.duration) * 100;
            document.getElementById('track-progress').style.width = pct + '%';

            // Detecta cuando la canción termina y vuelve a empezar desde el segundo 0
            if (cur < lastAudioTime - 5) {
                if (gameState === 'SESSION_END') {
                    startNewGameSession();
                }
            }
            lastAudioTime = cur;
        }
    }

    function init() {
        setupBoardData();
        gameState = 'START';
        requestAnimationFrame(gameLoop);
    }

    function generateRandomStations() {
        const stations = [
            { name: 'RETIRO', col: 0, row: 0, isStart: true, coins: 0 },
            { name: 'SAN MIGUEL', col: 6, row: 7, isEnd: true, coins: 500 }
        ];

        let occupied = Array(ROWS).fill(false).map(() => Array(COLS).fill(false));
        occupied[0][0] = true; occupied[0][1] = true;
        occupied[7][6] = true; occupied[7][7] = true;

        let shuffledNames = [...INTERMEDIATE_STATION_POOL].sort(() => Math.random() - 0.5);
        let selectedNames = shuffledNames.slice(0, 4);

        const coinValues = [150, 200, 250, 300];

        selectedNames.forEach((name, idx) => {
            let placed = false;
            let attempts = 0;
            while (!placed && attempts < 200) {
                attempts++;
                let r = Math.floor(Math.random() * ROWS);
                let c = Math.floor(Math.random() * (COLS - 1));

                if (!occupied[r][c] && !occupied[r][c + 1]) {
                    occupied[r][c] = true;
                    occupied[r][c + 1] = true;
                    stations.push({
                        name: name,
                        col: c,
                        row: r,
                        isStart: false,
                        coins: coinValues[idx]
                    });
                    placed = true;
                }
            }
        });

        return stations;
    }

    function setupBoardData() {
        grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
        
        let currentStations = generateRandomStations();

        currentStations.forEach(st => {
            st.visited = false;
            grid[st.row][st.col] = { type: 'station', station: st, isMainCell: true };
            grid[st.row][st.col + 1] = { type: 'station', station: st, isMainCell: false };
        });

        queue = [];
        for (let i = 0; i < 6; i++) pushRandomTrack();

        cursor = { col: 2, row: 0 };
        roundScore = 0;
    }

    function startNewGameSession() {
        sessionScore = 0;
        totalCoins = 0;
        totalTracksTraversed = 0;
        roundCount = 1;
        timer = INITIAL_TIMER;
        scoreSaved = false;

        setupBoardData();
        gameState = 'BUILDING';

        if (audioElement) {
            if (audioElement.paused) playAudioTrack();
            roundAudioStart = audioElement.currentTime;
        }

        startGlobalTimer();
    }

    function nextRound() {
        if (timer <= 0) {
            gameState = 'SESSION_END';
            return;
        }

        roundCount++;
        setupBoardData();
        gameState = 'BUILDING';
    }

    function startGlobalTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (audioElement && !audioElement.paused) {
                let curTime = audioElement.currentTime;
                if (curTime < roundAudioStart && audioElement.duration) {
                    curTime += audioElement.duration;
                }
                let elapsed = curTime - roundAudioStart;
                timer = Math.max(0, Math.ceil(INITIAL_TIMER - elapsed));

                if (timer <= 0 && gameState === 'BUILDING') {
                    timer = 0;
                    startTrainRun();
                }
            }
        }, 100);
    }

    function playAudioTrack() {
        if (audioElement) {
            audioElement.play().then(() => {
                document.getElementById('play-icon').classList.add('playing');
            }).catch(err => {
                console.log('Autoplay bloqueado:', err);
            });
        }
    }

    function toggleAudio() {
        if (!audioElement) return;
        if (audioElement.paused) {
            audioElement.play();
            document.getElementById('play-icon').classList.add('playing');
        } else {
            audioElement.pause();
            document.getElementById('play-icon').classList.remove('playing');
        }
    }

    function pushRandomTrack() {
        const randKey = TRACK_KEYS[Math.floor(Math.random() * TRACK_KEYS.length)];
        queue.push(randKey);
    }

    function placeTrack() {
        if (gameState !== 'BUILDING' && gameState !== 'RUNNING') return;

        let cell = grid[cursor.row][cursor.col];
        if (cell && cell.type === 'station') return;

        let trackKey = queue.shift();
        grid[cursor.row][cursor.col] = {
            type: 'track',
            key: trackKey,
            ports: TRACK_TYPES[trackKey].ports
        };
        pushRandomTrack();
    }

    function startTrainRun() {
        if (gameState !== 'BUILDING') return;
        gameState = 'RUNNING';

        let startCell = grid[0][0];

        train = {
            col: 0,
            row: 0,
            entryPort: 3,
            exitPort: 1,
            progress: 0,
            speed: TRAIN_SPEED,
            lastStation: startCell ? startCell.station : null
        };
    }

    function updateTrain() {
        if (gameState !== 'RUNNING') return;

        train.progress += train.speed;

        if (train.progress >= 1) {
            train.progress = 0;
            totalTracksTraversed++;
            roundScore += 50;

            let nextCol = train.col;
            let nextRow = train.row;

            if (train.exitPort === 0) nextRow--;
            if (train.exitPort === 1) nextCol++;
            if (train.exitPort === 2) nextRow++;
            if (train.exitPort === 3) nextCol--;

            if (nextCol < 0 || nextCol >= COLS || nextRow < 0 || nextRow >= ROWS) {
                endRound(false);
                return;
            }

            let targetCell = grid[nextRow][nextCol];
            let requiredEntryPort = (train.exitPort + 2) % 4;

            if (!targetCell) {
                endRound(false);
                return;
            }

            if (targetCell.type === 'station') {
                if (train.lastStation !== targetCell.station) {
                    train.lastStation = targetCell.station;
                    targetCell.station.visited = true;
                    roundScore += targetCell.station.coins;
                    totalCoins += targetCell.station.coins;
                }

                if (targetCell.station.isEnd) {
                    roundScore += 1000;
                    endRound(true);
                    return;
                }

                train.col = nextCol;
                train.row = nextRow;
                train.entryPort = requiredEntryPort;
                train.exitPort = (requiredEntryPort + 2) % 4;
            } else if (targetCell.type === 'track') {
                train.lastStation = null;

                if (targetCell.ports[requiredEntryPort] === 1) {
                    train.col = nextCol;
                    train.row = nextRow;
                    train.entryPort = requiredEntryPort;
                    let nextExit = targetCell.ports.findIndex((p, idx) => p === 1 && idx !== requiredEntryPort);
                    train.exitPort = nextExit;
                } else {
                    endRound(false);
                }
            }
        }
    }

    function endRound(isVictory) {
        sessionScore += roundScore;
        if (isVictory) {
            gameState = 'VICTORY';
        } else {
            gameState = 'GAMEOVER';
        }

        if (timer <= 0) {
            gameState = 'SESSION_END';
        }
    }

    function drawScreen() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, GRID_WIDTH, canvas.height);

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let x = c * CELL_SIZE;
                let y = r * CELL_SIZE;

                ctx.strokeStyle = 'rgba(0, 0, 0, 0.12)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

                let cell = grid[r][c];
                if (cell) {
                    if (cell.type === 'station' && cell.isMainCell) {
                        drawStation(x, y, cell.station, cell.station.visited);
                    } else if (cell.type === 'track') {
                        drawTrackPieceCustom(x, y, CELL_SIZE, cell.key);
                    }
                }
            }
        }

        if (gameState === 'BUILDING' || gameState === 'RUNNING') {
            let cx = cursor.col * CELL_SIZE;
            let cy = cursor.row * CELL_SIZE;
            ctx.strokeStyle = '#ff3366';
            ctx.lineWidth = 3.5;
            ctx.strokeRect(cx + 1, cy + 1, CELL_SIZE - 2, CELL_SIZE - 2);
        }

        if (gameState === 'RUNNING' || gameState === 'VICTORY' || gameState === 'GAMEOVER' || gameState === 'SESSION_END') {
            drawTrain();
        }

        drawSidebar();

        if (gameState === 'START') {
            ctx.fillStyle = 'rgba(2, 18, 6, 0.92)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let boxWidth = 480;
            let boxHeight = 220;
            let boxX = (canvas.width - boxWidth) / 2;
            let boxY = (canvas.height - boxHeight) / 2;

            ctx.fillStyle = '#000000';
            ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
            ctx.strokeStyle = '#00ff66';
            ctx.lineWidth = 3;
            ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 20px Courier New';
            ctx.fillText('Boleto de ida hasta San Miguel', canvas.width / 2, boxY + 80);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px Courier New';
            ctx.fillText('Presiona A o toca la pantalla para comenzar', canvas.width / 2, boxY + 145);

            ctx.textAlign = 'left';
        }

        if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
            ctx.fillStyle = 'rgba(2, 18, 6, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';
            if (gameState === 'VICTORY') {
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 22px Courier New';
                ctx.fillText('¡LLEGASTE A SAN MIGUEL!', canvas.width / 2, 140);
            } else {
                ctx.fillStyle = '#ff3366';
                ctx.font = 'bold 22px Courier New';
                ctx.fillText('¡NO LLEGA MÁS!', canvas.width / 2, 140);
            }

            ctx.fillStyle = '#00ff66';
            ctx.font = 'bold 13px Courier New';
            ctx.fillText(`Puntos Ronda: +${roundScore}`, canvas.width / 2, 185);
            ctx.fillText(`TOTAL ACUMULADO: ${sessionScore}`, canvas.width / 2, 215);

            ctx.fillStyle = '#ffffff';
            ctx.font = '12px Courier New';
            ctx.fillText(`Reloj: ${timer}s - Presiona A para la siguiente ronda`, canvas.width / 2, 280);
            ctx.textAlign = 'left';
        }

        if (gameState === 'SESSION_END') {
            if (!scoreSaved && sessionScore > 0) {
                scoreSaved = true;
                let playerName = prompt("¡Llegaste a San Miguel! Ingresa tu nombre para el ranking:", "Nombre");
                if (playerName && playerName.trim() !== "") {
                    playerName = playerName.trim().substring(0, 15);
                    let finalScore = sessionScore;

                    topPlayers.push({ name: playerName, score: finalScore });
                    topPlayers.sort((a, b) => b.score - a.score);
                    topPlayers = topPlayers.slice(0, 5);
                    localStorage.setItem('cachedRanking_SanMiguel', JSON.stringify(topPlayers));

                    fetch(`${RANKING_API_URL}?action=save&name=${encodeURIComponent(playerName)}&score=${finalScore}`)
                        .then(res => res.json())
                        .catch(err => console.error("Error al guardar ranking", err));
                }
            }

            ctx.fillStyle = 'rgba(2, 18, 6, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 24px Courier New';
            ctx.fillText('¡FIN DE LA PARTIDA!', canvas.width / 2, 50);

            ctx.fillStyle = '#00ff66';
            ctx.font = '12px Courier New';
            ctx.fillText(`Rondas: ${roundCount}  |  Fichas: ${totalCoins}  |  Vías: ${totalTracksTraversed}`, canvas.width / 2, 80);

            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 16px Courier New';
            ctx.fillText(`PUNTAJE FINAL: ${sessionScore}`, canvas.width / 2, 108);

            ctx.fillStyle = '#ff8c00';
            ctx.font = 'bold 15px Courier New';
            ctx.fillText('--- MEJORES PUNTAJES ---', canvas.width / 2, 140);

            ctx.font = '15px Courier New';
            if (topPlayers.length === 0) {
                ctx.fillStyle = 'rgba(0, 255, 102, 0.6)';
                ctx.fillText('Conectando al ranking...', canvas.width / 2, 180);
            } else {
                topPlayers.forEach((p, index) => {
                    let text = `${index + 1}. ${p.name.padEnd(10, ' ')} ${p.score}`;
                    ctx.fillStyle = (index === 0) ? '#ffff00' : '#00ff66';
                    ctx.fillText(text, canvas.width / 2, 175 + (index * 26));
                });
            }

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px Courier New';
            ctx.fillText('Próximo tren arribará en unos minutos...', canvas.width / 2, 350);
            ctx.font = '9px Courier New';
            ctx.fillStyle = 'rgba(0, 255, 102, 0.7)';
            ctx.fillText('(Tren San Martin circula con demoras por un problema técnico)', canvas.width / 2, 375);
            ctx.textAlign = 'left';
        }
    }

    function drawSidebar() {
        ctx.fillStyle = '#051d0a';
        ctx.fillRect(SIDEBAR_X, 0, SIDEBAR_WIDTH, canvas.height);

        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(SIDEBAR_X, 0);
        ctx.lineTo(SIDEBAR_X, canvas.height);
        ctx.stroke();

        const centerX = SIDEBAR_X + (SIDEBAR_WIDTH / 2);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#00ff66';
        ctx.font = 'bold 13px Courier New';
        ctx.fillText('ESTADO', centerX, 24);

        ctx.strokeStyle = 'rgba(0, 255, 102, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(SIDEBAR_X + 10, 32, SIDEBAR_WIDTH - 20, 95);

        ctx.font = 'bold 12px Courier New';
        ctx.fillStyle = timer <= 10 ? '#ff3366' : '#ffffff';
        ctx.fillText(`TIEMPO: ${String(timer).padStart(3, '0')}s`, centerX, 56);

        ctx.fillStyle = '#ffcc00';
        ctx.fillText(`FICHAS: ${totalCoins}`, centerX, 81);

        ctx.fillStyle = '#00ff66';
        ctx.font = 'bold 12px Courier New';
        ctx.fillText(`TOTAL: ${sessionScore + roundScore}`, centerX, 106);

        ctx.fillStyle = '#00ff66';
        ctx.font = 'bold 13px Courier New';
        ctx.fillText('PRÓXIMAS VÍAS', centerX, 152);

        let queueBoxY = 162;
        for (let i = 0; i < 4; i++) {
            let itemKey = queue[i];
            let itemY = queueBoxY + i * 68;

            if (i === 0) {
                ctx.fillStyle = 'rgba(255, 204, 0, 0.15)';
                ctx.fillRect(SIDEBAR_X + 10, itemY, SIDEBAR_WIDTH - 20, 60);
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 2;
                ctx.strokeRect(SIDEBAR_X + 10, itemY, SIDEBAR_WIDTH - 20, 60);
            } else {
                ctx.strokeStyle = 'rgba(0, 255, 102, 0.25)';
                ctx.lineWidth = 1;
                ctx.strokeRect(SIDEBAR_X + 10, itemY, SIDEBAR_WIDTH - 20, 60);
            }

            drawTrackPieceCustom(SIDEBAR_X + 16, itemY + 10, 40, itemKey);

            ctx.textAlign = 'left';
            ctx.fillStyle = i === 0 ? '#ffcc00' : '#ffffff';
            ctx.font = 'bold 9px Courier New';
            ctx.fillText(TRACK_TYPES[itemKey].name, SIDEBAR_X + 62, itemY + 34);
        }
        ctx.textAlign = 'left';
    }

    function drawStation(x, y, st, visited) {
        let width = CELL_SIZE * 2 - 4;
        let height = CELL_SIZE - 4;

        ctx.fillStyle = '#000000';
        ctx.fillRect(x + 2, y + 2, width, height);

        ctx.strokeStyle = st.isStart ? '#00ff66' : (st.isEnd ? '#ff3366' : '#ffcc00');
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x + 2, y + 2, width, height);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px Courier New';
        ctx.textAlign = 'center';

        if (st.coins > 0) {
            ctx.fillText(st.name, x + CELL_SIZE, y + 25);
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 11px Courier New';
            ctx.fillText(`+${st.coins}`, x + CELL_SIZE, y + 43);
        } else {
            ctx.fillText(st.name, x + CELL_SIZE, y + 32);
        }
        ctx.textAlign = 'left';
    }

    function drawTrackPieceCustom(x, y, size, key) {
        if (images[key] && images[key].complete && images[key].naturalWidth > 0) {
            ctx.drawImage(images[key], x, y, size, size);
            return;
        }

        ctx.strokeStyle = '#222222';
        ctx.lineWidth = size * 0.12;
        ctx.beginPath();

        let cx = x + size / 2;
        let cy = y + size / 2;

        if (key === 'via1') {
            ctx.moveTo(x, cy); ctx.lineTo(x + size, cy);
        } else if (key === 'via2') {
            ctx.moveTo(cx, y); ctx.lineTo(cx, y + size);
        } else if (key === 'via3') {
            ctx.moveTo(cx, y); ctx.quadraticCurveTo(cx, cy, x + size, cy);
        } else if (key === 'via4') {
            ctx.moveTo(x + size, cy); ctx.quadraticCurveTo(cx, cy, cx, y + size);
        } else if (key === 'via5') {
            ctx.moveTo(cx, y + size); ctx.quadraticCurveTo(cx, cy, x, cy);
        } else if (key === 'via6') {
            ctx.moveTo(x, cy); ctx.quadraticCurveTo(cx, cy, cx, y);
        }
        ctx.stroke();

        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = size * 0.04;
        ctx.stroke();
    }

    function drawTrain() {
        let tx = train.col * CELL_SIZE + CELL_SIZE / 2;
        let ty = train.row * CELL_SIZE + CELL_SIZE / 2;

        if (train.exitPort === 0) ty -= train.progress * CELL_SIZE;
        if (train.exitPort === 1) tx += train.progress * CELL_SIZE;
        if (train.exitPort === 2) ty += train.progress * CELL_SIZE;
        if (train.exitPort === 3) tx -= train.progress * CELL_SIZE;

        let trainImg = images['train'];
        let size = CELL_SIZE * 0.85;

        if (trainImg && trainImg.complete && trainImg.naturalWidth > 0) {
            ctx.drawImage(trainImg, tx - size / 2, ty - size / 2, size, size);
        } else {
            // Carga de respaldo en caso de retraso al traer la imagen PNG
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(tx, ty, 10, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function gameLoop() {
        updateTrain();
        drawScreen();
        requestAnimationFrame(gameLoop);
    }

    function moveCursor(dc, dr) {
        if (gameState !== 'BUILDING' && gameState !== 'RUNNING') return;
        cursor.col = Math.max(0, Math.min(COLS - 1, cursor.col + dc));
        cursor.row = Math.max(0, Math.min(ROWS - 1, cursor.row + dr));
    }

    function handleActionA() {
        if (gameState === 'START') {
            startNewGameSession();
        } else if (gameState === 'BUILDING' || gameState === 'RUNNING') {
            placeTrack();
        } else if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
            nextRound();
        }
    }

    function handleActionB() {
        if (gameState === 'BUILDING') {
            startTrainRun();
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        if (e.code === 'ArrowUp') moveCursor(0, -1);
        if (e.code === 'ArrowDown') moveCursor(0, 1);
        if (e.code === 'ArrowLeft') moveCursor(-1, 0);
        if (e.code === 'ArrowRight') moveCursor(1, 0);
        if (e.code === 'Space' || e.code === 'KeyA') handleActionA();
        if (e.code === 'KeyB') handleActionB();
    });

    document.getElementById('btn-up').addEventListener('click', () => moveCursor(0, -1));
    document.getElementById('btn-down').addEventListener('click', () => moveCursor(0, 1));
    document.getElementById('btn-left').addEventListener('click', () => moveCursor(-1, 0));
    document.getElementById('btn-right').addEventListener('click', () => moveCursor(1, 0));
    document.getElementById('btn-a').addEventListener('click', handleActionA);
    document.getElementById('btn-b').addEventListener('click', handleActionB);

    canvas.addEventListener('click', (e) => {
        if (gameState === 'START') {
            handleActionA();
            return;
        }
        if (gameState === 'SESSION_END') {
            return;
        }
        if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
            handleActionA();
            return;
        }

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        if (clickX < GRID_WIDTH) {
            const c = Math.floor(clickX / CELL_SIZE);
            const r = Math.floor(clickY / CELL_SIZE);

            if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
                cursor.col = c;
                cursor.row = r;
                handleActionA();
            }
        }
    });

    loadConfigAndAssets(init);
</script>
</body>
